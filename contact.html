<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>ASRUNN</title>
    
        <link rel="icon" href="/addons/favicon.ico">
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="css/normalize.css">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/contact.css">
    </head>
<body>

    <div class="bg">
    </div>

    <nav class="sidenav flex-center">
        <a class="p-1" href="/index">accueil</a>
        <!-- <a class="p-1" href="/asrunn/projets">projets</a> -->
        <a class="p-1" href="/team">team</a>
        <a class="p-1" href="/contact">contact</a>
        <a class="p-1" href="/bio">bio</a>
        <a class="p-1" href="/presse">presse</a>
        <a class="p-1" href="/discographie.html">discographie</a>
    </nav>

    <menu class="flex">
        <button class="m-1 p-1 flex-center">☰</button>
    </menu>

    <section id="contact" class="flex-center mb-3">
        <h1>Contact</h1>
        <form id="form" action="https://api.web3forms.com/submit" method="POST" class="mt-1 flex-center">
            <input type="hidden" name="access_key" value="fe98b6a0-949c-49f3-84b4-95e5e3d80684">
            <!-- <input type="hidden" name="redirect" value="https://asrunn.net/thanks.html"> -->
            <input type="hidden" name="subject" value="Nouveau message depuis le site web !">
            <input type="hidden" name="from_name" value="ASRUNN">
            <input type="checkbox" name="botcheck" id="" style="display: none;">

            <div class="form-group-container montserrat">
                <div class="form-group flex-center mb-2">
                    <label for="name" class="form-label mb-1 montserrat">Nom & Prénom</label>
                    <input id="name" name="name" class="form-input" placeholder="Votre nom" type="text" required />
                </div>

                <div class="form-group flex-center mb-2">
                    <label for="email" class="form-label mb-1 montserrat">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Votre email" required />
                </div>

                <div class="form-group flex-center mb-2">
                    <label for="subject" class="form-label mb-1 montserrat">Sujet</label>
                    <input type="subject" id="subject" name="subject" class="form-input" placeholder="Le sujet de votre message" required />
                </div>

                <div class="form-group flex-center mb-2">
                    <label for="message" class="form-label mb-1 montserrat">Votre message</label>
                    <textarea class="form-textarea" id="message" name="message" class="form-input" placeholder="Votre message" required></textarea>
                </div>
            </div>

            <div class="h-captcha mb-2" data-captcha="true"></div>

            <button class="button flex-center montserrat" type="submit">Envoyer un message</button>

            <div id="result" class="montserrat mt-1 p2"></div>
        </form>
    </section>

    <section class="socials" class="links flex-center mb-3">
        <h1>suivre</h1>
        <div class="mt-1 flex-center">
            <a class="p-1 m-1" href="https://www.instagram.com/asrunn_music/">
                <img src="addons/socials/instagram.svg" alt="instagram icon" class="icon">
            </a>
            <a class="p-1 m-1" href="https://www.facebook.com/profile.php?id=61574515272832">
                <img src="addons/socials/facebook.svg" alt="facebook icon" class="icon">
            </a>
            <a class="p-1 m-1" href="https://www.tiktok.com/@asrunn_music?_t=ZN-8vtUfBdlJ82&_r=1">
                <img src="addons/socials/tiktok.svg" alt="tiktok icon" class="icon">
            </a>
            <a class="p-1 m-1" href="https://snapchat.com/t/FK1PYcDW">
                <img src="addons/socials/snapchat.svg" alt="snapchat icon" class="icon">
            </a>
        </div>
    </section>
    
    <footer class="flex-center pt-1 pb-1">
        <p>&copy; 2025 ASRUNN - Tous droits réservés</p>
    </footer>

    <script>
        window.onload = function() {
            // Reset the form fields when the page loads
            document.getElementById("form").reset();
        };
    </script>

    <script src="scripts/main.js"></script>
    <script src="scripts/contact.js"></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
    
</body>
</html>
